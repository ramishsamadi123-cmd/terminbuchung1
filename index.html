<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termin mit Ramish</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>📅 Termin mit Ramish</h1>
    <p class="subtitle">Wähle ein Datum und eine Uhrzeit aus.</p>

    <form id="terminForm">
      <label for="datum">Datum</label>
      <input type="date" id="datum" required>

      <label for="uhrzeit">Uhrzeit</label>
      <select id="uhrzeit" required>
        <option value="">Bitte auswählen</option>
        <option>09:00</option>
        <option>10:00</option>
        <option>11:00</option>
        <option>14:00</option>
        <option>15:00</option>
        <option>16:00</option>
      </select>

      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="email">E-Mail</label>
      <input type="email" id="email" required>

      <label for="nachricht">Nachricht</label>
      <textarea id="nachricht" rows="5" placeholder="Optional"></textarea>

      <button type="submit" id="sendenButton">Termin senden</button>
      <p id="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
