<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Termin buchen</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <!-- ========================= -->
    <!-- OBERER HEADER -->
    <!-- ========================= -->

    <div class="booking-hero">

      <div class="booking-hero-text">

        <span class="booking-label">
          TERMINPLANUNG
        </span>

        <h1>
          Termin buchen
        </h1>

        <p>
          Wähle deinen gewünschten Termin
          schnell und unkompliziert.
        </p>

      </div>

      <div class="booking-hero-icon">
        <span>📅</span>
      </div>

    </div>

    <div class="hero-divider"></div>


    <!-- ========================= -->
    <!-- FORMULAR -->
    <!-- ========================= -->

    <form id="terminForm">


      <!-- ========================= -->
      <!-- 1. LEISTUNG -->
      <!-- ========================= -->

      <div class="service-section">

        <h2>
          <span class="step-number">1</span>
          Leistung wählen
        </h2>

        <div class="input-group">

          <label for="leistung">
            Leistung
          </label>

          <select
            id="leistung"
            required
          >

            <option value="">
              Bitte auswählen
            </option>

            <option value="Verwaltung">
              Verwaltung
            </option>

            <option value="Kino">
              Kino
            </option>

            <option value="Sport / Fußball">
              Sport / Fußball
            </option>

            <option value="Freunde">
              Freunde
            </option>

            <option value="Schwimmen">
              Schwimmen
            </option>

            <option value="Beratung">
              Beratung
            </option>

            <option value="Besprechung">
              Besprechung
            </option>

            <option value="Lernen / Nachhilfe">
              Lernen / Nachhilfe
            </option>

            <option value="Freizeit">
              Freizeit
            </option>

            <option value="Spazieren">
              Spazieren
            </option>

            <option value="Essen / Restaurant">
              Essen / Restaurant
            </option>

            <option value="Sonstiges">
              Sonstiges
            </option>

          </select>

        </div>

      </div>


      <!-- ========================= -->
      <!-- 2. DATUM -->
      <!-- ========================= -->

      <div class="termin-bereich">

        <h2>
          <span class="step-number">2</span>
          Datum wählen
        </h2>


        <div class="calendar">

          <div class="calendar-header">

            <button
              type="button"
              id="prevMonth"
              class="calendar-arrow"
            >
              ‹
            </button>

            <div id="calendarTitle"></div>

            <button
              type="button"
              id="nextMonth"
              class="calendar-arrow"
            >
              ›
            </button>

          </div>


          <div class="calendar-weekdays">
            <span>Mo</span>
            <span>Di</span>
            <span>Mi</span>
            <span>Do</span>
            <span>Fr</span>
            <span>Sa</span>
            <span>So</span>
          </div>


          <div
            id="calendarDays"
            class="calendar-days"
          ></div>

        </div>


        <input
          type="hidden"
          id="datum"
          required
        >


        <!-- ========================= -->
        <!-- 3. UHRZEIT -->
        <!-- ========================= -->

        <h2 class="time-title">
          <span class="step-number">3</span>
          Uhrzeit wählen
        </h2>


        <div class="time-grid">

          <button type="button" class="time-btn" data-time="08:00">08:00</button>
          <button type="button" class="time-btn" data-time="09:00">09:00</button>
          <button type="button" class="time-btn" data-time="10:00">10:00</button>
          <button type="button" class="time-btn" data-time="11:00">11:00</button>

          <button type="button" class="time-btn" data-time="12:00">12:00</button>
          <button type="button" class="time-btn" data-time="13:00">13:00</button>
          <button type="button" class="time-btn" data-time="14:00">14:00</button>
          <button type="button" class="time-btn" data-time="15:00">15:00</button>

          <button type="button" class="time-btn" data-time="16:00">16:00</button>
          <button type="button" class="time-btn" data-time="17:00">17:00</button>
          <button type="button" class="time-btn" data-time="18:00">18:00</button>
          <button type="button" class="time-btn" data-time="19:00">19:00</button>

          <button type="button" class="time-btn" data-time="20:00">20:00</button>
          <button type="button" class="time-btn" data-time="21:00">21:00</button>
          <button type="button" class="time-btn" data-time="22:00">22:00</button>

        </div>


        <input
          type="hidden"
          id="uhrzeit"
          required
        >


        <!-- ========================= -->
        <!-- TERMIN-ZUSAMMENFASSUNG -->
        <!-- ========================= -->

        <div
          class="termin-summary"
          id="terminSummary"
        >

          <div class="summary-icon">
            📅
          </div>

          <div class="summary-text">

            <strong>
              Dein Termin
            </strong>

            <span id="summaryDate">
              Noch kein Datum gewählt
            </span>

            <span id="summaryTime">
              Noch keine Uhrzeit gewählt
            </span>

          </div>

        </div>

      </div>


      <!-- ========================= -->
      <!-- 4. DEINE DATEN -->
      <!-- ========================= -->

      <div class="daten-bereich">

        <h2>
          <span class="step-number">4</span>
          Deine Daten
        </h2>


        <div class="daten-grid">

          <div class="input-group">

            <label for="name">
              Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Dein Name"
              required
            >

          </div>


          <div class="input-group">

            <label for="email">
              E-Mail
            </label>

            <input
              type="email"
              id="email"
              placeholder="deine@email.de"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <label for="nachricht">
            Nachricht
            <span class="optional">
              (optional)
            </span>
          </label>

          <textarea
            id="nachricht"
            rows="4"
            placeholder="Möchtest du mir noch etwas mitteilen?"
          ></textarea>

        </div>

      </div>


      <!-- ========================= -->
      <!-- SENDEN -->
      <!-- ========================= -->

      <button
        type="submit"
        id="sendenButton"
      >
        ✓ Termin buchen
      </button>


      <p
        id="status"
        aria-live="polite"
      ></p>

    </form>

  </main>


  <!-- EMAILJS -->
  <script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
  </script>


  <!-- DEIN JAVASCRIPT -->
  <script src="script.js"></script>

</body>

</html>
