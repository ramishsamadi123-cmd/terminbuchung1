<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Termin mit Ramish</title>

  <!-- Design -->
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>

  <main class="card">

  <div class="header-icon">📅</div>

<h1>Termin buchen</h1>

<p class="subtitle">
  Wähle deinen gewünschten Termin aus.
</p>

    <form id="terminForm">

     <div class="termin-bereich">

  <h2>Termin auswählen</h2>

  <label for="datum">📅 Datum</label>
  <input type="date" id="datum" required>

  <label for="uhrzeit">🕒 Uhrzeit</label>
  <select id="uhrzeit" required>
    <option value="">Bitte auswählen</option>
    <option value="08:00">08:00</option>
    <option value="09:00">09:00</option>
    <option value="10:00">10:00</option>
    <option value="11:00">11:00</option>
    <option value="12:00">12:00</option>
    <option value="13:00">13:00</option>
    <option value="14:00">14:00</option>
    <option value="15:00">15:00</option>
    <option value="16:00">16:00</option>
    <option value="17:00">17:00</option>
    <option value="18:00">18:00</option>
    <option value="19:00">19:00</option>
    <option value="20:00">20:00</option>
    <option value="21:00">21:00</option>
    <option value="22:00">22:00</option>
  </select>

</div>

      <!-- NAME -->
      <label for="name">Name</label>

      <input
        type="text"
        id="name"
        placeholder="Dein Name"
        required
      >


      <!-- EMAIL -->
      <label for="email">E-Mail</label>

      <input
        type="email"
        id="email"
        placeholder="deine@email.de"
        required
      >


      <!-- NACHRICHT -->
      <label for="nachricht">Nachricht</label>

      <textarea
        id="nachricht"
        rows="5"
        placeholder="Möchtest du mir noch etwas mitteilen? (optional)"
      ></textarea>


      <!-- ABSENDEN -->
      <button type="submit" id="sendenButton">
        Termin senden
      </button>


      <!-- STATUSMELDUNG -->
      <p id="status" aria-live="polite"></p>

    </form>

  </main>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
